name: Deploy preview to GitHub Pages

# Public test link: https://kemalrahmandesign.github.io/premier-motors/
# Built with PREVIEW=1 so Google doesn't index the preview before the real domain is live.
on:
  push:
    branches: [claude/peaceful-dijkstra-bfokug]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: node build.mjs
        env:
          BASE_PATH: /premier-motors
          PREVIEW: '1'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
