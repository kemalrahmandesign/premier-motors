name: Deploy site to GitHub Pages

# Live site: https://premiermotorsmd.com (custom domain set in repo Settings > Pages).
# Production build: no base path, indexable, canonical URLs on premiermotorsmd.com.
# For a no-index test build in a sub-folder instead, set BASE_PATH=/premier-motors and PREVIEW='1'.
on:
  push:
    branches: [claude/peaceful-dijkstra-bfokug]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: node build.mjs && echo premiermotorsmd.com > dist/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
